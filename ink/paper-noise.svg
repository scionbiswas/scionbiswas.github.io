<!-- fffuel nnnoise output (frequency .05, surface 4, light #8FA3B5, elevation 60, specular .6). Tiled large over the page so it reads as stonewash mottle, not grain. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700"><defs><filter id="nnnoise-filter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="linearRGB"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="15" stitchTiles="stitch" x="0%" y="0%" width="100%" height="100%" result="turbulence"/><feSpecularLighting surfaceScale="4" specularConstant="0.6" specularExponent="20" lighting-color="#8FA3B5" x="0%" y="0%" width="100%" height="100%" in="turbulence" result="specularLighting"><feDistantLight azimuth="3" elevation="60"/></feSpecularLighting></filter></defs><rect width="700" height="700" fill="#8fa3b5" filter="url(#nnnoise-filter)"/></svg>
